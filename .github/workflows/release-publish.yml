name: release-publish.yml

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org/"

      - name: Check and Update npm
        run: |
          echo "Initial npm version:"
          npm --version
          npm install -g npm@latest
          echo "Updated npm version:"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Enforce secure Node.js baseline
        run: |
          npm run security:node-baseline
          npm run security:node-runtime

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
